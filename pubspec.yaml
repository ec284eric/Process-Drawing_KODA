name: drawing_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^8.1.4
  collection: ^1.18.0
  extended_image: ^9.0.7
  flex_color_picker: ^3.6.0
  flutter_bloc: ^8.1.6
  flutter_drawing_board: ^0.9.5
  flutter_feather_icons: ^2.0.0+1
  flutter_launcher_icons: ^0.13.1
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  image_editor: ^1.5.1
  image_size_getter: ^2.2.0
  intl: any
  go_router: ^14.2.8
  gal: ^2.3.1
  scribble: ^0.10.0+1
  value_notifier_tools: ^0.1.2
  video_player: ^2.9.2
  chewie: ^1.9.2
  el_tooltip: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/appstore.png"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/
